<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动效库 / helmet-to-face — Lando 逆向复现</title>
<style>
  :root{ --ink:#0b0b0c; --paper:#f2f0ea; --accent:#ff4a1c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
    font-family:"Helvetica Neue",Inter,-apple-system,"PingFang SC",Arial,sans-serif;
    overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .bar{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;
    justify-content:space-between;align-items:baseline;padding:22px 28px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:rgba(242,240,234,.5);
    pointer-events:none;mix-blend-mode:difference}
  .hint{position:fixed;left:28px;bottom:26px;z-index:10;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:rgba(242,240,234,.45);
    pointer-events:none;transition:opacity .4s ease}
  .hint b{color:var(--accent);font-weight:400}
  /* 触发热区：原站是 [data-gl-helmet="hover"] 上的 mouseenter/mouseleave */
  #trigger{position:fixed;inset:0;z-index:5;cursor:crosshair}
  .veilout{position:fixed;inset:0;background:var(--ink);z-index:20;pointer-events:none;
    transition:opacity 1.1s cubic-bezier(.16,1,.3,1)}
  .veilout.gone{opacity:0}
  @media (prefers-reduced-motion:reduce){ .veilout{display:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="trigger"></div>
<div class="bar">
  <span>Motion library / 01</span>
  <span>helmet → face · Lando (OFF+BRAND)</span>
</div>
<div class="hint" id="hint">指针移入画面 · <b>悬停</b> 人脸浮出金属</div>
<div class="veilout" id="veilout"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. 程序化贴图
   ------------------------------------------------------------
   原站用的是真实资产：
     /textures/head/webp/{diffuse,shadow-softer-edit,depth,normal,roughness}.webp
   为了让这个 demo 自包含、无版权问题，这里用 Canvas 生成同等结构的替身。
   换真图只需要把 make*() 换成 TextureLoader 加载同名文件，shader 一行不改。
   ============================================================ */
const S = 1024;

function cv(w = S, h = S) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, x: c.getContext('2d') };
}

/* —— 头盔：深色金属壳 + 横向反光带 + 边缘冷光 —— */
function makeHelmet() {
  const { c, x } = cv();
  x.fillStyle = '#0b0b0c'; x.fillRect(0, 0, S, S);

  // 壳体的球面明暗
  const g = x.createRadialGradient(S * 0.42, S * 0.34, S * 0.04, S * 0.5, S * 0.52, S * 0.62);
  g.addColorStop(0, '#4a4f57');
  g.addColorStop(0.35, '#22262b');
  g.addColorStop(0.72, '#101215');
  g.addColorStop(1, '#07080a');
  x.fillStyle = g;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.5, S * 0.44, S * 0.48, 0, 0, Math.PI * 2); x.fill();

  // 面罩：一条横向的深色玻璃
  x.save();
  x.beginPath(); x.ellipse(S * 0.5, S * 0.5, S * 0.44, S * 0.48, 0, 0, Math.PI * 2); x.clip();
  const vg = x.createLinearGradient(0, S * 0.34, 0, S * 0.68);
  vg.addColorStop(0, 'rgba(120,150,170,.55)');
  vg.addColorStop(0.18, 'rgba(20,26,32,.92)');
  vg.addColorStop(0.72, 'rgba(10,12,15,.96)');
  vg.addColorStop(1, 'rgba(60,70,80,.35)');
  x.fillStyle = vg;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.52, S * 0.42, S * 0.19, 0, 0, Math.PI * 2); x.fill();

  // 面罩上的高光条（金属反光的来源）
  const hg = x.createLinearGradient(S * 0.18, 0, S * 0.62, 0);
  hg.addColorStop(0, 'rgba(255,255,255,0)');
  hg.addColorStop(0.45, 'rgba(210,232,255,.42)');
  hg.addColorStop(0.62, 'rgba(255,255,255,.12)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = hg;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.44, S * 0.36, S * 0.055, -0.06, 0, Math.PI * 2); x.fill();
  x.restore();

  // 边缘轮廓光
  x.strokeStyle = 'rgba(150,180,205,.30)';
  x.lineWidth = 3;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.5, S * 0.44, S * 0.48, 0, 0, Math.PI * 2); x.stroke();

  // 颗粒
  const img = x.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/* —— 人脸：侧光肖像，暗部压死，只有高光区可读 —— */
function makeFace() {
  const { c, x } = cv();
  x.fillStyle = '#0a0908'; x.fillRect(0, 0, S, S);

  // 头骨
  const skin = x.createRadialGradient(S * 0.38, S * 0.33, S * 0.05, S * 0.5, S * 0.5, S * 0.5);
  skin.addColorStop(0, '#c99a72');
  skin.addColorStop(0.4, '#8d6344');
  skin.addColorStop(0.75, '#3d2a1d');
  skin.addColorStop(1, '#100d0b');
  x.fillStyle = skin;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.51, S * 0.33, S * 0.42, 0, 0, Math.PI * 2); x.fill();

  // 颈部
  x.fillStyle = '#2a1d14';
  x.beginPath(); x.ellipse(S * 0.5, S * 0.93, S * 0.17, S * 0.18, 0, 0, Math.PI * 2); x.fill();

  // 眼窝
  x.fillStyle = 'rgba(12,10,9,.92)';
  x.beginPath(); x.ellipse(S * 0.39, S * 0.47, S * 0.062, S * 0.032, -0.12, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(S * 0.62, S * 0.47, S * 0.062, S * 0.032, 0.12, 0, Math.PI * 2); x.fill();
  // 眼球高光
  x.fillStyle = 'rgba(235,230,220,.85)';
  x.beginPath(); x.arc(S * 0.377, S * 0.465, S * 0.012, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(S * 0.607, S * 0.465, S * 0.012, 0, Math.PI * 2); x.fill();

  // 眉
  x.strokeStyle = 'rgba(24,18,14,.9)'; x.lineWidth = S * 0.016; x.lineCap = 'round';
  x.beginPath(); x.moveTo(S * 0.33, S * 0.42); x.quadraticCurveTo(S * 0.39, S * 0.40, S * 0.44, S * 0.425); x.stroke();
  x.beginPath(); x.moveTo(S * 0.57, S * 0.425); x.quadraticCurveTo(S * 0.62, S * 0.40, S * 0.68, S * 0.42); x.stroke();

  // 鼻梁高光 + 鼻底阴影
  const ng = x.createLinearGradient(S * 0.5, S * 0.44, S * 0.5, S * 0.68);
  ng.addColorStop(0, 'rgba(255,225,190,.30)');
  ng.addColorStop(1, 'rgba(255,225,190,0)');
  x.fillStyle = ng;
  x.beginPath(); x.ellipse(S * 0.505, S * 0.55, S * 0.035, S * 0.12, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(10,8,7,.55)';
  x.beginPath(); x.ellipse(S * 0.5, S * 0.655, S * 0.055, S * 0.018, 0, 0, Math.PI * 2); x.fill();

  // 嘴
  x.strokeStyle = 'rgba(60,32,26,.85)'; x.lineWidth = S * 0.011;
  x.beginPath(); x.moveTo(S * 0.44, S * 0.74);
  x.quadraticCurveTo(S * 0.5, S * 0.755, S * 0.56, S * 0.738); x.stroke();

  // 颧骨受光
  const cg = x.createRadialGradient(S * 0.34, S * 0.58, 0, S * 0.34, S * 0.58, S * 0.14);
  cg.addColorStop(0, 'rgba(255,214,170,.22)');
  cg.addColorStop(1, 'rgba(255,214,170,0)');
  x.fillStyle = cg;
  x.beginPath(); x.arc(S * 0.34, S * 0.58, S * 0.14, 0, Math.PI * 2); x.fill();

  return c;
}

/* —— 深度：中心凸起，四周落下 —— 驱动真实的顶点位移 —— */
function makeDepth() {
  const { c, x } = cv();
  x.fillStyle = '#000'; x.fillRect(0, 0, S, S);
  const g = x.createRadialGradient(S * 0.5, S * 0.46, S * 0.02, S * 0.5, S * 0.5, S * 0.47);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.55, '#cfcfcf');
  g.addColorStop(0.86, '#4a4a4a');
  g.addColorStop(1, '#000000');
  x.fillStyle = g;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.5, S * 0.46, S * 0.47, 0, 0, Math.PI * 2); x.fill();
  // 面部起伏：鼻梁 + 眉弓
  x.globalCompositeOperation = 'lighter';
  const nb = x.createRadialGradient(S * 0.5, S * 0.56, 0, S * 0.5, S * 0.56, S * 0.09);
  nb.addColorStop(0, 'rgba(255,255,255,.55)');
  nb.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = nb;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.56, S * 0.045, S * 0.14, 0, 0, Math.PI * 2); x.fill();
  return c;
}

/* —— 粗糙度：暗部粗糙、高光面光滑（这是"金属"读起来对的关键） —— */
function makeRoughness() {
  const { c, x } = cv();
  x.fillStyle = '#9a9a9a'; x.fillRect(0, 0, S, S);
  const g = x.createRadialGradient(S * 0.42, S * 0.36, 0, S * 0.5, S * 0.5, S * 0.55);
  g.addColorStop(0, '#1e1e1e');
  g.addColorStop(0.5, '#5a5a5a');
  g.addColorStop(1, '#c8c8c8');
  x.fillStyle = g;
  x.beginPath(); x.ellipse(S * 0.5, S * 0.5, S * 0.44, S * 0.48, 0, 0, Math.PI * 2); x.fill();
  return c;
}

/* —— 法线：从深度图用 Sobel 算出来 —— */
function makeNormal(depthCanvas) {
  const src = depthCanvas.getContext('2d').getImageData(0, 0, S, S).data;
  const { c, x } = cv();
  const out = x.createImageData(S, S);
  const at = (px, py) => src[(Math.min(S - 1, Math.max(0, py)) * S + Math.min(S - 1, Math.max(0, px))) * 4] / 255;
  const strength = 2.6;
  for (let y = 0; y < S; y++) {
    for (let i = 0; i < S; i++) {
      const dx = (at(i + 1, y - 1) + 2 * at(i + 1, y) + at(i + 1, y + 1))
               - (at(i - 1, y - 1) + 2 * at(i - 1, y) + at(i - 1, y + 1));
      const dy = (at(i - 1, y + 1) + 2 * at(i, y + 1) + at(i + 1, y + 1))
               - (at(i - 1, y - 1) + 2 * at(i, y - 1) + at(i + 1, y - 1));
      let nx = -dx * strength, ny = -dy * strength, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      const o = (y * S + i) * 4;
      out.data[o] = (nx * 0.5 + 0.5) * 255;
      out.data[o + 1] = (ny * 0.5 + 0.5) * 255;
      out.data[o + 2] = (nz * 0.5 + 0.5) * 255;
      out.data[o + 3] = 255;
    }
  }
  x.putImageData(out, 0, 0);
  return c;
}

/* ============================================================
   1. 流体光标（简化版）
   ------------------------------------------------------------
   原站是 GPGPU 流体模拟（world.fluidCursor.sourceTarget.texture）。
   这里用 2D canvas 做等效的"拖尾 + 衰减"：
     画布初始填白（1），指过的地方画黑（0），每帧整体回白一点。
   shader 里 1.0 - tex.r 就得到"划过"的遮罩，和原站一致。
   ============================================================ */
class CursorField {
  constructor() {
    const { c, x } = cv(512, 512);
    this.canvas = c; this.ctx = x;
    x.fillStyle = '#fff'; x.fillRect(0, 0, 512, 512);
    this.texture = new THREE.CanvasTexture(c);
    this.texture.minFilter = this.texture.magFilter = THREE.LinearFilter;
    this.px = 0.5; this.py = 0.5;
    this.last = { x: 0.5, y: 0.5 };
    this.dirty = true;
  }
  move(nx, ny) {
    this.px = nx; this.py = ny;
    const c = this.ctx, W = 512;
    const x = nx * W, y = (1 - ny) * W;
    const lx = this.last.x * W, ly = (1 - this.last.y) * W;

    c.globalCompositeOperation = 'source-over';
    // 沿上一帧到当前帧画一段，避免快速移动时断成点
    const steps = Math.max(1, Math.ceil(Math.hypot(x - lx, y - ly) / 6));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const cx = lx + (x - lx) * t, cy = ly + (y - ly) * t;
      const r = 19;
      const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.55, 'rgba(0,0,0,.75)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
    }
    this.last.x = nx; this.last.y = ny;
    this.dirty = true;
  }
  update() {
    // 缓慢回白：痕迹保留 ~1.2s
    const c = this.ctx;
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = 'rgba(255,255,255,.055)';
    c.fillRect(0, 0, 512, 512);
    this.dirty = true;
  }
  commit() { if (this.dirty) { this.texture.needsUpdate = true; this.dirty = false; } }
}

/* ============================================================
   2. 两层渲染 —— 这是原站的结构，不是可选的简化
   ------------------------------------------------------------
   lando.js @1062925 的 PX 类：
     sceneHead   头盔模型 + 带位移的平面 + 灯光  →  renderTarget
     renderPlane 纯 2D ShaderMaterial，把 RT 和 head.diffuse 合成

   分两层的原因：
     · 位移 / 法线 / 金属反射只作用在头盔上
     · 人脸照片是"平的"，不能被灯打亮 —— 它只是被合成上去的一张图
   合成一层搞定的话，人脸会被当成布料打光，一眼假。
   ============================================================ */
/* ---- 贴图（程序化） ---- */
const texHelmet = new THREE.CanvasTexture(makeHelmet());
texHelmet.colorSpace = THREE.SRGBColorSpace;
const texFace = new THREE.CanvasTexture(makeFace());
texFace.colorSpace = THREE.SRGBColorSpace;

const depthCanvas = makeDepth();
const texDepth = new THREE.CanvasTexture(depthCanvas);
const texNormal = new THREE.CanvasTexture(makeNormal(depthCanvas));
const texRough = new THREE.CanvasTexture(makeRoughness());

const cursor = new CursorField();

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setClearColor(0x0b0b0c, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

/* ---- 层 A：头盔（渲染到 RT） ---- */
const sceneHead = new THREE.Scene();
const camHead = new THREE.PerspectiveCamera(15, 1, 0.1, 100);   // 原站 fov 15
camHead.position.set(0, 0, 4.2);
sceneHead.add(camHead);

/* 环境反射：金属没有环境就是一块死黑。
   原站用 HDRI（assets 里的 light / dark / faded）。这里程序化画一张
   studio 等距柱状图：顶部亮、底部暗、几条竖向灯条 —— 金属就会拉出
   一条明确的高光带，这是"产品级"读数的主要来源，比调 roughness 有效。 */
function makeEnv() {
  const { c, x } = cv(1024, 512);
  const sky = x.createLinearGradient(0, 0, 0, 512);
  sky.addColorStop(0, '#ffffff');
  sky.addColorStop(0.32, '#9fb2c4');
  sky.addColorStop(0.55, '#3b434c');
  sky.addColorStop(1, '#08090a');
  x.fillStyle = sky; x.fillRect(0, 0, 1024, 512);
  [120, 300, 760].forEach((cx2, i) => {
    const w = i === 1 ? 46 : 26;
    const g = x.createLinearGradient(cx2 - w, 0, cx2 + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(cx2 - w, 0, w * 2, 300);
  });
  const warm = x.createRadialGradient(880, 150, 0, 880, 150, 190);
  warm.addColorStop(0, 'rgba(255,140,70,.85)');
  warm.addColorStop(1, 'rgba(255,140,70,0)');
  x.fillStyle = warm; x.fillRect(690, 0, 340, 340);

  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
sceneHead.environment = makeEnv();

sceneHead.add(new THREE.HemisphereLight(0xffffff, 0x000000, 2.2));
const pt = new THREE.PointLight(0xffffff, 2.2);
pt.position.set(-0.75, 0.2, 0.4);
sceneHead.add(pt);
const key = new THREE.DirectionalLight(0xdfe9ff, 2.6);
key.position.set(1.2, 1.4, 1.5);
sceneHead.add(key);

/* 层 A 的材质：普通 MeshStandardMaterial 就够 —— 不需要注入 shader，
   位移 / 法线 / 粗糙度三个 map 已经能撑起金属感。 */
const matHelmet = new THREE.MeshStandardMaterial({
  map: texHelmet,
  displacementMap: texDepth,
  displacementScale: 0.14,
  normalMap: texNormal,
  normalScale: new THREE.Vector2(0.9, 0.9),
  roughnessMap: texRough,
  metalness: 0.78,
  roughness: 0.42,
  transparent: true,
});

const geo = new THREE.PlaneGeometry(1, 1, 128, 128);   // 位移需要细分
const helmetMesh = new THREE.Mesh(geo, matHelmet);
sceneHead.add(helmetMesh);

/* ---- renderTarget ---- */
const RT_SCALE = 1.0;
const rt = new THREE.WebGLRenderTarget(16, 16, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  samples: 2,
});

/* ---- 层 B：合成（全屏 2D，纯 ShaderMaterial，不参与光照） ---- */
const uniforms = {
  uHelmetHover: { value: 0 },
  uCursorIntensity: { value: 1.0 },
  uFilter: { value: 0 },
  uColorFilter: { value: new THREE.Color('#ff4a1c') },
  tHelmet: { value: rt.texture },
  tFace: { value: texFace },
  tCursor: { value: cursor.texture },
  uTime: { value: 0 },
};

const matCompose = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthTest: false,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);   // 已经是裁剪空间，铺满
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uHelmetHover;
    uniform float uCursorIntensity;
    uniform float uFilter;
    uniform vec3  uColorFilter;
    uniform sampler2D tHelmet;
    uniform sampler2D tFace;
    uniform sampler2D tCursor;
    uniform float uTime;
    const float PI = 3.141592;

    /* 原站 blendOverlay / blendHardLight 的 vec3 版 */
    vec3 blendOverlay3(vec3 b, vec3 l) {
      return mix(2.0 * b * l, 1.0 - 2.0 * (1.0 - b) * (1.0 - l), step(0.5, b));
    }

    void main() {
      /* ---- 底：人脸照片 ---- */
      vec4 faceCol   = texture2D(tFace, vUv);
      vec4 helmetCol = texture2D(tHelmet, vUv);
      vec3 base = mix(vec3(0.045), faceCol.rgb, faceCol.a);

      /* ---- 波浪边界：中间弯、两端平 ----
         sin(uHelmetHover*PI) 让边界在过渡中段最弯，起止时是平的。 */
      float hoverTransition = vUv.y + sin(vUv.x * PI) * sin(uHelmetHover * PI) * 0.2;

      /* ---- 光标遮罩 + 进度遮罩 ---- */
      vec4 cursorTex = texture2D(tCursor, vUv);
      float cursorEffect = step(0.1, 1.0 - cursorTex.r);
      cursorEffect += step(1.0 - hoverTransition, uHelmetHover);
      cursorEffect = clamp(cursorEffect * uCursorIntensity, 0.0, 1.0);

      vec3 final = mix(base, helmetCol.rgb, cursorEffect * helmetCol.a);

      /* ---- uFilter：灰度 + 对比 + 硬光（原站滚动用的第二层） ---- */
      vec3 end = mix(faceCol.rgb, vec3(0.05), 1.0 - faceCol.a);
      end = vec3(dot(end, vec3(0.299, 0.587, 0.114)));
      end = (end - 0.5) * 0.8 + 0.5;
      end *= 0.75;
      end = blendOverlay3(end, uColorFilter);

      vec3 col = mix(final, end, uFilter);

      /* ShaderMaterial 不走 renderer 的自动色彩空间转换，手动转回 sRGB */
      gl_FragColor = vec4(pow(max(col, 0.0), vec3(1.0 / 2.2)), 1.0);
    }
  `,
});

const sceneOut = new THREE.Scene();
const camOut = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
sceneOut.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matCompose));

/* ---- 尺寸 ---- */
function layout() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio, 1.75);
  renderer.setSize(w, h, false);
  rt.setSize(Math.round(w * dpr * RT_SCALE), Math.round(h * dpr * RT_SCALE));

  camHead.aspect = w / h;
  camHead.updateProjectionMatrix();
  const visH = 2 * camHead.position.z * Math.tan((camHead.fov * Math.PI / 180) / 2);
  const visW = visH * camHead.aspect;
  const s = Math.max(visW, visH) * 1.0;
  helmetMesh.scale.set(s, s, s);
  /* displacementScale 是模型空间绝对值，会被 mesh.scale 再放大一次。
     不除 s 的话平面越大隆起越夸张，最后把曲面顶到相机前面 —— 整屏全黑。 */
  matHelmet.displacementScale = 0.14 / s;
}
layout();
addEventListener('resize', layout);

/* ---- 可选：吃真实资源 ----
   ?assets → 从同目录 ./assets/ 读原站贴图。图不随仓库分发（版权 + 体积）。
   base 是 https://assets.itsoffbrand.io/lando/gl
     textures/head/webp/diffuse.webp             人脸（原站就是这张）
     textures/head/webp/depth.webp               位移，只有 3.6KB，很糊但够
     textures/head/webp/normal.webp
     textures/head/webp/roughness.webp
   头盔那层原站是 3D 模型渲到 RT，没有现成贴图，所以这里仍用程序化盔体。 */
if (location.search.includes('assets')) {
  const L = new THREE.TextureLoader();
  const grab = (name, srgb) => new Promise((res) => {
    L.load(`./assets/${name}.webp`, (t) => {
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      res(t);
    }, undefined, () => res(null));
  });
  Promise.all([grab('diffuse', 1), grab('depth', 0), grab('normal', 0), grab('roughness', 0)])
    .then(([face, dp, nr, rg]) => {
      if (face) uniforms.tFace.value = face;
      if (dp) matHelmet.displacementMap = dp;
      if (nr) matHelmet.normalMap = nr;
      if (rg) matHelmet.roughnessMap = rg;
      matHelmet.needsUpdate = true;
      document.querySelector('.bar span:last-child').textContent = 'helmet → face · real face asset';
    });
}

/* ============================================================
   3. 交互 —— 参数照原站
   ------------------------------------------------------------
   enter: uHelmetHover 0→1, 1.5s, expo.inOut
   leave: uHelmetHover 1→0, 1.0s, expo.inOut
   视差: easedNormalized(0.025), intensity 0.075
   ============================================================ */
const EASE = {
  expoInOut: (t) => t === 0 ? 0 : t === 1 ? 1
    : t < 0.5 ? 0.5 * Math.pow(2, 20 * t - 10)
    : 1 - 0.5 * Math.pow(2, -20 * t + 10),
};

class Tween {
  constructor(obj, to, dur, ease) {
    this.obj = obj; this.from = obj.value; this.to = to;
    this.dur = dur * 1000; this.ease = ease; this.t0 = performance.now();
    this.dead = false;
  }
  step(now) {
    const t = Math.min(1, (now - this.t0) / this.dur);
    this.obj.value = this.from + (this.to - this.from) * this.ease(t);
    if (t >= 1) this.dead = true;
  }
}

let tween = null;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function hover(val) {
  if (reduced) { uniforms.uHelmetHover.value = val; return; }
  if (tween) tween.dead = true;
  tween = new Tween(uniforms.uHelmetHover, val, val === 1 ? 1.5 : 1.0, EASE.expoInOut);
}

const trigger = document.getElementById('trigger');
const hint = document.getElementById('hint');
trigger.addEventListener('pointerenter', () => { hover(1); hint.style.opacity = 0; });
trigger.addEventListener('pointerleave', () => { hover(0); hint.style.opacity = .45; });

const mouse = { x: 0.5, y: 0.5, ex: 0.5, ey: 0.5 };
addEventListener('pointermove', (e) => {
  mouse.x = e.clientX / innerWidth;
  mouse.y = e.clientY / innerHeight;
  cursor.move(mouse.x, mouse.y);
}, { passive: true });

/* ---- 调试出口 ---- */
if (location.search.includes('debug')) {
  window.__mf = { uniforms, matHelmet, matCompose, cursor, helmetMesh, camHead, rt };
}

/* ============================================================
   4. 渲染
   ============================================================ */
const clock = new THREE.Clock();
let lastCursor = 0;

function tick() {
  const now = performance.now();
  const dt = clock.getDelta();

  if (tween && !tween.dead) tween.step(now);
  uniforms.uTime.value += dt;

  /* 视差：ease 0.025 的指数逼近（原站 createEasedNormalized） */
  const k = 1 - Math.pow(1 - 0.025, dt * 60);
  mouse.ex += (mouse.x - mouse.ex) * k;
  mouse.ey += (mouse.y - mouse.ey) * k;
  const nx = mouse.ex - 0.5, ny = mouse.ey - 0.5;

  helmetMesh.rotation.y = nx * 0.075;          // 原站 intensity 0.075
  helmetMesh.rotation.x = -ny * 0.075;
  camHead.position.x = nx * 0.02;
  camHead.position.y = -ny * 0.02;
  camHead.lookAt(0, 0, 0);

  if (now - lastCursor > 40) { cursor.update(); lastCursor = now; }
  cursor.commit();

  /* 层 A → RT */
  renderer.setRenderTarget(rt);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(sceneHead, camHead);

  /* 层 B → 屏幕 */
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x0b0b0c, 1);
  renderer.render(sceneOut, camOut);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* 开场淡出 + 自动演示 */
requestAnimationFrame(() => {
  setTimeout(() => document.getElementById('veilout').classList.add('gone'), 60);
  const AUTO = !location.search.includes('noauto');
  if (!reduced && AUTO) setTimeout(() => {
    hover(1);
    setTimeout(() => hover(0), 2600);
  }, 3000);
});
</script>
</body>
